# PostgreSQL database (production)
spring.datasource.url=jdbc:postgresql://localhost:5432/labureserve
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=labureserve
spring.datasource.password=labureserve

# Connection pool tuning for PostgreSQL
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.awt.headless=false

# JPA/Hibernate — PostgreSQL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true

# Embedded web server (disabled for desktop app — set port if you need H2 Console etc.)
server.port=0
